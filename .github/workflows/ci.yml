name: CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    name: Java Compilation & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Java Sources
        run: |
          echo "=== CI-Doctor: Scanning and Compiling Java Source Files ==="
          FAILURES=0
          while IFS= read -r f; do
            echo "Compiling: $f"
            if ! javac "$f"; then
              echo "COMPILATION_ERROR in $f"
              FAILURES=$((FAILURES + 1))
            fi
          done < <(find . -name "*.java")

          if [ $FAILURES -gt 0 ]; then
            echo "❌ CI FAILED: $FAILURES Java file(s) failed compilation."
            exit 1
          fi
          echo "SUCCESS: All Java sources compiled without syntax or type errors."
